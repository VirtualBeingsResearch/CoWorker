services:
  relay:
    build: .
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://relay.example.com:8443}
      RELAY_LISTEN: :8443
      RELAY_ADMIN_LISTEN: :8444
      RELAY_ADMIN_URL: http://127.0.0.1:8444
      RELAY_DATABASE: /var/lib/coworker-relay/relay.db
      RELAY_SIGNING_KEY: /var/lib/coworker-relay/relay-signing.key
      RELAY_CONNECTIONS_PER_MINUTE: "60"
      RELAY_FRAMES_PER_MINUTE: "2400"
      RELAY_AUTH_CONCURRENCY: "32"
      RELAY_BAN_FAILURE_LIMIT: "5"
      RELAY_BAN_FAILURE_WINDOW: 10m
      RELAY_BAN_DURATION: 1h
      RELAY_MAX_FRAME_BYTES: "262144"
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?set RELAY_ADMIN_TOKEN}
    ports:
      - "8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - relay-data:/var/lib/coworker-relay
    read_only: true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "coworker-relay", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  relay-data:
