{{hint}}{{content}}
==== 片段结束 ===='''
subjective_instruction = '''请将上方对话片段从你自己的第一人称视角压缩为记忆摘要。
格式：「我正在/已经...。关键词：A, B, C, ...」
摘要中应密集出现人名、项目名、工具名、任务名、网页链接、账号密码等专有名词或关键信息（用作后续检索锚点）。
直接输出纯文本，不要 JSON，不要解释，只输出摘要本身。'''
objective_prompt = '''你是一个记忆压缩助手。请将以下对话历史压缩为高质量的纯文本摘要。

⚠️ 重要原则：
1. 摘要的首要目标是成为长期记忆的「查询锚点」——摘要中应密集出现：
   - 人名、项目名、工具名、任务名等专有名词
   - 已讨论的核心概念和技术术语
   - 关键决策的主题词
   - 未完成任务的关键词 + 状态
2. 格式：先写第三方叙述，再跟「关键词：A, B, C, ...」
3. 直接输出纯文本，不要 JSON 包装。'''
objective_hint = '''
背景提示: {{hint}}'''

