version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: uv
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: cargo
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: npm
    directories:
      - /web
      - /apps/explore-lab/frontend
      - /apps/coworker-desktop/desktop
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
