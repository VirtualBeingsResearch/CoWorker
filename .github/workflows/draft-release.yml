name: Build CoWorker Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag (for example v0.3.5)"
        required: true
        type: string
      notarize_macos:
        description: "Attempt macOS notarization when Apple credentials are configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-coworker-release-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate and start desktop candidate build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate draft request
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ inputs.tag }}
          GITHUB_REF_TYPE: tag
          RELEASE_TAG: ${{ inputs.tag }}
          SELECTED_REF_NAME: ${{ github.ref_name }}
          SELECTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$SELECTED_REF_TYPE" != "branch" || "$SELECTED_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          python scripts/check_version.py

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release tag $RELEASE_TAG already exists and is immutable. Prepare a newer patch version."
            exit 1
          fi

          release_json="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]'
          )"
          if [[ "$(jq 'length' <<< "$release_json")" -gt 1 ]]; then
            echo "::error::Multiple releases use tag $RELEASE_TAG."
            exit 1
          fi
          if [[ "$(jq 'length' <<< "$release_json")" -eq 1 ]] &&
            [[ "$(jq -r '.[0].draft' <<< "$release_json")" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG is already published and cannot be revised."
            exit 1
          fi

      - name: Start release candidate build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZE_MACOS: ${{ inputs.notarize_macos }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh workflow run coworker-desktop-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --field notarize_macos="$NOTARIZE_MACOS" \
            --field release_tag="$RELEASE_TAG"

          echo "Started a revisable desktop release candidate build for $RELEASE_TAG."
