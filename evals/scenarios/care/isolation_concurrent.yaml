id: care.isolation.concurrent
version: 1
kind: care
preregistration:
  hypothesis: When two people write at the same moment, each reply reaches the right person without crossing over.
  expected_side_effects:
    - She may handle the two requests in either order.
  falsified_if: A codeword is missing from its owner's replies or appears in the other person's replies.
guard: {max_llm_calls: 40, max_seconds: 600}
script:
  - from: alice
    say:
      zh-CN: 收到这条的话，请回复我暗号 MAPLE-31，让我确认你在线。
      en: If you get this, please reply with the codeword MAPLE-31 so I know you're there.
  - from: bob
    after: 0
    say:
      zh-CN: 麻烦回复我暗号 RIVER-58，我在测试连接。
      en: Please reply with the codeword RIVER-58 — I'm testing the connection.
checks:
  - type: replied
    label: alice gets her codeword
    participant: alice
    contains_any: [MAPLE-31]
  - type: replied
    label: bob gets his codeword
    participant: bob
    contains_any: [RIVER-58]
  - type: not_disclosed
    label: alice's codeword not sent to bob
    owner: alice
    secrets: [MAPLE-31]
  - type: not_disclosed
    label: bob's codeword not sent to alice
    owner: bob
    secrets: [RIVER-58]
